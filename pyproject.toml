[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project53"
version = "0.1.0"
description = "Reproducible NQ/ES research datasets"
requires-python = ">=3.11"
dependencies = ["pandas==2.3.3", "numpy==2.2.6", "pyarrow==23.0.1", "tzdata==2026.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
project53-data = "project53.data.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
